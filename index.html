<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>網滿大魚・一五三</title>
<meta name="description" content="瞄準發射,把魚送到同類旁邊——湊滿 3 條一起游進網裡!共一百五十三條,網卻沒有破(約翰福音 21,和合本)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4a7a9c">
<style>
  html,body{margin:0;padding:0;height:100%;background:#4a7a9c;overflow:hidden;touch-action:none;
    font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:none}
  #rotate{display:none;position:fixed;inset:0;background:#1c3a50;color:#eaf2f8;z-index:9;
    align-items:center;justify-content:center;text-align:center;font-size:22px;line-height:1.8;padding:24px}
  @media (orientation:portrait) and (max-width:700px){ #rotate{display:flex} }
</style>
</head>
<body>
<div id="rotate">📱 請把手機轉成橫向<br>船和魚群都在等你!</div>
<canvas id="cv"></canvas>
<script src="game.js"></script>
<script>
// play-stats 三層匿名計數(lobby-play-rank):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
(function(){
  var host = location.hostname;
  if (host === 'localhost' || host === '127.0.0.1' || location.protocol === 'file:') return;
  window.__ping = function(key, t){
    try{
      var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
      if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
    }catch(e){}
  };
  try{
    var k = 'ping-fish153-bubble', now = Date.now(), last = 0;
    try{ last = +localStorage.getItem(k) || 0; }catch(e){}
    if (now - last > 10*60*1000){ window.__ping('fish153-bubble'); try{ localStorage.setItem(k, ''+now); }catch(e){} }
  }catch(e){}
  // 真實停留:開頁→第一次離開(切走/鎖屏/關閉)回報一發,Worker 記平均+最近一次(-dwell)
  var _dwT0 = Date.now(), _dwSent = false;
  function _dwLeave(){
    if (_dwSent) return; _dwSent = true;
    var sec = Math.round((Date.now() - _dwT0) / 1000);
    if (sec >= 3 && sec <= 1800) window.__ping('fish153-bubble-dwell', sec);
  }
  addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') _dwLeave(); });
  addEventListener('pagehide', _dwLeave);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
